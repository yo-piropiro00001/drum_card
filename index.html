<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Achievement Card Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

:root{
  --card-width:330px;
  --card-height:462px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#07070a;
  color:white;
  font-family:'Noto Sans JP',sans-serif;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.container{
  width:100%;
  max-width:440px;
}

h1{
  text-align:center;
  margin-bottom:20px;
  font-family:'Cinzel',serif;
  font-size:22px;
  background:linear-gradient(135deg,#ffd700,#fff,#b38728);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.preview-wrapper{
  display:flex;
  justify-content:center;
  perspective:1000px;
  margin-bottom:25px;
}

.tcg-card{
  width:var(--card-width);
  height:var(--card-height);
  border-radius:18px;
  overflow:hidden;
  position:relative;
  transform-style:preserve-3d;
  transition:0.15s ease;
}

.full-art-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  z-index:1;
  opacity:.95;
}

.card-overlay{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
}

.card-inner{
  position:relative;
  z-index:3;
  height:100%;
  padding:16px;
  display:flex;
  flex-direction:column;
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.card-name{
  font-size:20px;
  font-weight:900;
  text-shadow:0 2px 4px rgba(0,0,0,.8);
}

.card-dp{
  font-family:'Cinzel',serif;
  color:#ff5252;
  font-weight:900;
  text-shadow:0 2px 4px #000;
}

.card-dp span{
  font-size:30px;
}

.card-art{
  height:200px;
  margin-top:10px;
  border-radius:12px;
  overflow:hidden;
  background:#111;
  background-size:cover;
  background-position:center;
  border:2px solid rgba(255,255,255,.15);
}

.card-body{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.move-block{
  background:rgba(10,12,18,.85);
  border-radius:12px;
  padding:12px;
}

.move-name{
  text-align:center;
  font-size:16px;
  font-weight:900;
}

.move-desc{
  text-align:center;
  margin-top:8px;
  line-height:1.6;
  font-size:12px;
  color:#d8dee7;
}

.card-footer{
  text-align:right;
  margin-top:8px;
  font-size:13px;
}

.controls{
  background:#12131c;
  padding:20px;
  border-radius:18px;
}

label{
  display:block;
  margin-bottom:6px;
  font-size:12px;
  color:#94a3b8;
}

input,
select{
  width:100%;
  margin-bottom:14px;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #2a2d3d;
  background:#090a10;
  color:white;
}

button{
  width:100%;
  border:none;
  border-radius:30px;
  padding:15px;
  cursor:pointer;
  font-weight:900;
  background:linear-gradient(135deg,#ffd700,#ff8c00);
  color:#111;
}

/* Normal */

.rarity-normal{
  background:
  linear-gradient(
    165deg,
    #2a2d3d,
    #151722
  );
  border:6px solid #374151;
}

/* AR */

.rarity-ar{
  border:3px solid white;
  background:#000;
}

.rarity-ar .card-overlay{
  background:
  linear-gradient(
    rgba(255,255,255,.1),
    rgba(255,255,255,0)
  );
}

/* SR */

.rarity-sr{
  border:4px solid gold;
  background:
  linear-gradient(
    135deg,
    #bf953f,
    #fcf6ba,
    #aa771c
  );
  box-shadow:
  0 0 25px rgba(255,215,0,.6);
}

.rarity-sr .card-overlay{
  background:
  radial-gradient(
    circle at 20% 20%,
    rgba(255,255,255,.8),
    transparent 15px
  ),
  radial-gradient(
    circle at 80% 70%,
    rgba(255,215,0,.8),
    transparent 15px
  );
}

/* Secret */

.rarity-star3{
  border:4px solid #ffd700;
  background:
  linear-gradient(
    135deg,
    #11081d,
    #03060f
  );
  box-shadow:
  0 0 30px rgba(0,240,255,.6);
}

.rarity-star3 .card-overlay{
  background:
  linear-gradient(
    110deg,
    transparent 35%,
    rgba(0,240,255,.4) 45%,
    rgba(255,0,255,.4) 50%,
    transparent 60%
  );
}

</style>
</head>

<body>

<div class="container">

<h1>Achievement Card Generator</h1>

<div class="preview-wrapper">

<div id="card" class="tcg-card rarity-normal">

<div id="fullArt" class="full-art-bg"></div>

<div class="card-overlay"></div>

<div class="card-inner">

<div class="card-header">

<h2 id="dispName" class="card-name">
あなた
</h2>

<div class="card-dp">
DP <span id="dispDP">100</span>
</div>

</div>

<div id="dispArt" class="card-art"></div>

<div class="card-body">

<div class="move-block">

<div id="dispSkill" class="move-name">
達成したこと
</div>

<p id="dispDesc" class="move-desc">
ここに説明が表示されます
</p>

</div>

</div>

<div class="card-footer">
<span id="dispRare">◇◇</span>
</div>

</div>

</div>

</div>

<div class="controls">

<label>RARITY</label>

<select id="rarity">
<option value="normal">Normal</option>
<option value="ar">AR</option>
<option value="sr">SR</option>
<option value="star3">Secret Rare</option>
</select>

<label>NAME</label>
<input id="name" value="あなた">

<label>DP</label>
<input id="dp" type="number" value="100">

<label>IMAGE</label>
<input id="image" type="file" accept="image/*">

<label>ACHIEVEMENT</label>
<input id="skill" value="達成したこと">

<label>DESCRIPTION</label>
<input id="desc" value="ここに説明が表示されます">

<button id="download">
EXPORT CARD IMAGE
</button>

</div>

</div>

<script>

const card = document.getElementById("card");

const bind=(input,target)=>{
  document.getElementById(input)
  .addEventListener("input",e=>{
    document.getElementById(target).textContent=e.target.value;
  });
};

bind("name","dispName");
bind("dp","dispDP");
bind("skill","dispSkill");
bind("desc","dispDesc");

const rarityMap={
 normal:"◇◇",
 ar:"☆",
 sr:"☆☆",
 star3:"SR 💎"
};

document
.getElementById("rarity")
.addEventListener("change",e=>{

 card.className=
 `tcg-card rarity-${e.target.value}`;

 document
 .getElementById("dispRare")
 .textContent=
 rarityMap[e.target.value];

});

document
.getElementById("image")
.addEventListener("change",e=>{

 const file=e.target.files[0];

 if(!file) return;

 const reader=new FileReader();

 reader.onload=ev=>{

   const img=ev.target.result;

   document
   .getElementById("dispArt")
   .style.backgroundImage=`url(${img})`;

   document
   .getElementById("fullArt")
   .style.backgroundImage=`url(${img})`;

 };

 reader.readAsDataURL(file);

});

const wrapper=document.querySelector(".preview-wrapper");

wrapper.addEventListener("mousemove",e=>{

 const rect=card.getBoundingClientRect();

 const x=e.clientX-rect.left-rect.width/2;
 const y=e.clientY-rect.top-rect.height/2;

 card.style.transform=
 `rotateY(${x/18}deg) rotateX(${-y/18}deg)`;

});

wrapper.addEventListener("mouseleave",()=>{

 card.style.transform=
 "rotateY(0deg) rotateX(0deg)";

});

document
.getElementById("download")
.addEventListener("click",()=>{

 card.style.transform="none";

 html2canvas(card,{
   scale:3,
   backgroundColor:null,
   useCORS:true
 })
 .then(canvas=>{

   const link=
   document.createElement("a");

   link.download=
   `achievement-card-${Date.now()}.png`;

   link.href=
   canvas.toDataURL("image/png");

   link.click();

 });

});

</script>

</body>
</html>
